<!DOCTYPE html>
<html lang="en">

<head>
    <script data-goatcounter="https://korovatron.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <link rel="icon" type="image/svg+xml" href="../images/mysticCow.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon-180x180.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>App Screenshots Gallery | Korovatron</title>
    <meta name="description" content="Feature screenshots from Korovatron's free browser-based tools for GCSE and A Level maths and computer science, including Graphiti, Vectorama, Trimension and Komplexiti.">
    <link rel="canonical" href="https://www.korovatron.co.uk/gallery/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.korovatron.co.uk/gallery/">
    <meta property="og:title" content="App Screenshots Gallery | Korovatron">
    <meta property="og:description" content="Feature screenshots from Korovatron's free browser-based maths and computer science tools for GCSE and A Level.">
    <meta property="og:image" content="https://www.korovatron.co.uk/images/galleries/graphiti/maxMin.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.korovatron.co.uk/gallery/">
    <meta name="twitter:title" content="App Screenshots Gallery | Korovatron">
    <meta name="twitter:description" content="Feature screenshots from Korovatron's free browser-based maths and computer science tools for GCSE and A Level.">
    <meta name="twitter:image" content="https://www.korovatron.co.uk/images/galleries/graphiti/maxMin.png">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ImageGallery",
        "@id": "https://www.korovatron.co.uk/gallery/#webpage",
        "url": "https://www.korovatron.co.uk/gallery/",
        "name": "App Screenshots Gallery | Korovatron",
        "description": "Feature screenshots from Korovatron's free browser-based maths and computer science tools for GCSE and A Level.",
        "isPartOf": {"@id": "https://www.korovatron.co.uk/#website"},
        "publisher": {"@id": "https://www.korovatron.co.uk/#organization"},
        "inLanguage": "en-GB",
        "breadcrumb": {
            "@type": "BreadcrumbList",
            "itemListElement": [
                {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.korovatron.co.uk/"},
                {"@type": "ListItem", "position": 2, "name": "Gallery", "item": "https://www.korovatron.co.uk/gallery/"}
            ]
        }
    }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            background: #000;
            color: #ffecb3;
            font-family: Arial, system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .breadcrumb {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 1.5rem;
        }

        .breadcrumb a {
            color: #888;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
        }

        .page-intro {
            font-size: 1rem;
            color: #ccc;
            margin: 0 0 3rem 0;
            line-height: 1.6;
        }

        .app-section {
            margin-bottom: 4rem;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid currentColor;
            flex-wrap: wrap;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .app-heading {
            font-size: 1.4rem;
            font-weight: 800;
            margin: 0;
            flex: 1;
        }

        .launch-link {
            padding: 0.4rem 0.9rem;
            border: 2px solid;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: box-shadow 0.2s;
            background: #000;
            white-space: nowrap;
        }

        .launch-link:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 1024px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .gallery-figure {
            margin: 0;
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: #080808;
        }

        .img-wrap {
            aspect-ratio: 16 / 9;
            background: #111;
            overflow: hidden;
            padding-top: 0.5rem;
        }

        .gallery-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        figcaption {
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #ccc;
            border-top: 1px solid #222;
        }

        /* per-app colour theming */
        .c-green   { color: #00ff88; border-color: #00ff88; }
        .c-neon    { color: #00cfc0; border-color: #00cfc0; }
        .c-orange  { color: #ff8844; border-color: #ff8844; }
        .c-purple  { color: #ff80ff; border-color: #ff80ff; }
        .c-blue    { color: #66ccff; border-color: #66ccff; }

        .launch-link.c-green  { box-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #00ff88; text-shadow: 0 0 5px #00ff88; }
        .launch-link.c-neon   { box-shadow: 0 0 10px #00cfc0, 0 0 20px #00cfc0, 0 0 30px #00cfc0; text-shadow: 0 0 5px #00cfc0; }
        .launch-link.c-orange { box-shadow: 0 0 10px #ff8844, 0 0 20px #ff8844, 0 0 30px #ff8844; text-shadow: 0 0 5px #ff8844; }
        .launch-link.c-purple { box-shadow: 0 0 10px #ff80ff, 0 0 20px #ff80ff, 0 0 30px #ff80ff; text-shadow: 0 0 5px #ff80ff; }
        .launch-link.c-blue   { box-shadow: 0 0 10px #66ccff, 0 0 20px #66ccff, 0 0 30px #66ccff; text-shadow: 0 0 5px #66ccff; }

        .fig-green  { border-color: #00ff8866; }
        .fig-neon   { border-color: #00cfc066; }
        .fig-orange { border-color: #ff884466; }
        .fig-purple { border-color: #ff80ff66; }
        .fig-blue   { border-color: #66ccff66; }

        @media (hover: hover) and (pointer: fine) {
            .launch-link.c-green:hover  { box-shadow: 0 0 15px #00ff88, 0 0 25px #00ff88, 0 0 35px #00ff88; }
            .launch-link.c-neon:hover   { box-shadow: 0 0 15px #18d6c8, 0 0 25px #18d6c8, 0 0 35px #18d6c8; }
            .launch-link.c-orange:hover { box-shadow: 0 0 15px #ffaa66, 0 0 25px #ffaa66, 0 0 35px #ffaa66; }
            .launch-link.c-purple:hover { box-shadow: 0 0 15px #ff99ff, 0 0 25px #ff99ff, 0 0 35px #ff99ff; }
            .launch-link.c-blue:hover   { box-shadow: 0 0 15px #88ddff, 0 0 25px #88ddff, 0 0 35px #88ddff; }
        }

        .status-msg {
            color: #888;
            font-style: italic;
        }

        .img-btn {
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            background: none;
            cursor: zoom-in;
        }

        .img-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: -2px;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 2vh 2vw;
            box-sizing: border-box;
        }

        .lightbox.is-open { display: flex; }

        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            cursor: zoom-out;
        }

        .lightbox-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            max-width: 96vw;
            max-height: 96vh;
        }

        .lightbox-img {
            display: block;
            max-width: 96vw;
            max-height: calc(96vh - 7rem);
            width: auto;
            height: auto;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .lightbox-img.lb-green  { outline: 2px solid #00ff8866; outline-offset: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 24px #00ff8840; }
        .lightbox-img.lb-neon   { outline: 2px solid #00cfc066; outline-offset: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 24px #00cfc040; }
        .lightbox-img.lb-orange { outline: 2px solid #ff884466; outline-offset: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 24px #ff884440; }
        .lightbox-img.lb-purple { outline: 2px solid #ff80ff66; outline-offset: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 24px #ff80ff40; }
        .lightbox-img.lb-blue   { outline: 2px solid #66ccff66; outline-offset: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 24px #66ccff40; }

        .lightbox-controls {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 860px;
        }

        .lightbox-caption {
            margin: 0;
            color: #ffecb3;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.4;
        }

        .lightbox-nav {
            padding: 0.4rem 0.9rem;
            border: 2px solid #fff;
            border-radius: 8px;
            background: #000;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .lightbox-nav:focus-visible,
        .lightbox-close:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        .lightbox-close {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            border: 2px solid #fff;
            border-radius: 8px;
            background: #000;
            color: #fff;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            z-index: 101;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #888;
            text-align: center;
        }

        footer a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
    </style>
</head>

<body>
    <main class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="/">Korovatron</a> &rsaquo; Gallery
        </nav>
        <h1>App Gallery</h1>
        <p class="page-intro">Feature screenshots from Korovatron's free browser-based tools for GCSE and A Level maths and computer science.</p>
        <div id="gallery-content">
            <p class="status-msg">Loading&hellip;</p>
        </div>
        <footer>
            <a href="/">Back to Korovatron</a>
        </footer>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
        <div class="lightbox-panel">
            <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
            <div class="lightbox-controls">
                <button class="lightbox-nav" id="lightbox-prev" type="button">Back</button>
                <p class="lightbox-caption" id="lightbox-caption"></p>
                <button class="lightbox-nav" id="lightbox-next" type="button">Next</button>
            </div>
        </div>
    </div>

    <script>
        const appMeta = {
            'Graphiti': {
                colorClass: 'green', url: '/graphiti/', icon: '/images/icons/graphitiIcon.png',
                description: 'Feature screenshots for Graphiti - the free graphing tool that automatically detects turning points, asymptotes, integrals, tangents and more. For GCSE and A Level maths.',
                firstImage: 'https://www.korovatron.co.uk/images/galleries/graphiti/parameterSliders.png',
            },
            'Komplexiti': {
                colorClass: 'neon', url: '/komplexiti/', icon: '/images/icons/complexiti.png',
                description: 'Feature screenshots for Komplexiti - the free Argand diagram app for A Level Further Maths. Plot complex loci, roots of unity, inequalities and more.',
                firstImage: 'https://www.korovatron.co.uk/images/galleries/komplexiti/complexInequalities.png',
            },
            'Vectorama': {
                colorClass: 'orange', url: '/vectorama/', icon: '/images/icons/vectorama.png',
                description: 'Feature screenshots for Vectorama - the free linear algebra tool for A Level maths. Explore vectors, matrices, transformations and eigenvalues in 2D and 3D.',
                firstImage: 'https://www.korovatron.co.uk/images/galleries/vectorama/MatrixIdentification.png',
            },
            'Trimension': {
                colorClass: 'purple', url: '/trimension/', icon: '/images/icons/trimensionIcon.png',
                description: 'Feature screenshots for Trimension - the free 3D geometry tool for GCSE and A Level maths. Build composite solids and explore 3D Pythagoras and trigonometry.',
                firstImage: 'https://www.korovatron.co.uk/images/galleries/trimension/addItems.png',
            },
            'Haskish': {
                colorClass: 'orange', url: '/haskish/', icon: '/images/icons/haskishIcon.png',
                description: 'Feature screenshots for Haskish - the free Haskell-style functional programming playground for AQA A Level Computer Science. No installation or sign-in required.',
                firstImage: 'https://www.korovatron.co.uk/images/galleries/haskish/functionalProgrammingAQA.png',
            },
        };

        const preferredOrder = ['Graphiti', 'Komplexiti', 'Vectorama', 'Trimension'];

        function esc(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function loadGallery() {
            const container = document.getElementById('gallery-content');
            const filterApp = new URLSearchParams(window.location.search).get('app');
            let data;
            try {
                const res = await fetch('../images/galleries/gallery-data.json');
                if (!res.ok) throw new Error();
                data = await res.json();
            } catch {
                container.innerHTML = '<p class="status-msg">Gallery could not be loaded.</p>';
                return;
            }

            let appNames = [
                ...preferredOrder.filter(n => Array.isArray(data[n]) && data[n].length),
                ...Object.keys(data).filter(n => !preferredOrder.includes(n) && Array.isArray(data[n]) && data[n].length)
            ];

            if (filterApp) {
                const filterAppLower = filterApp.toLowerCase();
                appNames = appNames.filter(n => n.toLowerCase() === filterAppLower);
                if (!appNames.length) {
                    container.innerHTML = '<p class="status-msg">No gallery found for this app.</p>';
                    return;
                }
                const resolvedApp = appNames[0]; // use the correctly-cased name from the data
                const meta = appMeta[resolvedApp];
                const appDesc = meta?.description ?? `Feature screenshots for ${resolvedApp}, a free browser-based tool from Korovatron.`;
                const appImg = meta?.firstImage ?? 'https://www.korovatron.co.uk/images/galleries/graphiti/maxMin.png';
                const appUrl = `https://www.korovatron.co.uk/gallery/?app=${encodeURIComponent(resolvedApp)}`;
                document.title = `${resolvedApp} Gallery | Korovatron`;
                document.querySelector('meta[name="description"]').content = appDesc;
                document.querySelector('link[rel="canonical"]').href = appUrl;
                document.querySelector('meta[property="og:url"]').content = appUrl;
                document.querySelector('meta[property="og:title"]').content = `${resolvedApp} Gallery | Korovatron`;
                document.querySelector('meta[property="og:description"]').content = appDesc;
                document.querySelector('meta[property="og:image"]').content = appImg;
                document.querySelector('meta[name="twitter:url"]').content = appUrl;
                document.querySelector('meta[name="twitter:title"]').content = `${resolvedApp} Gallery | Korovatron`;
                document.querySelector('meta[name="twitter:description"]').content = appDesc;
                document.querySelector('meta[name="twitter:image"]').content = appImg;
                document.querySelector('h1').textContent = `${resolvedApp} - Gallery`;
                document.querySelector('.breadcrumb').innerHTML =
                    `<a href="/">Korovatron</a> &rsaquo; <a href="/gallery/">Gallery</a> &rsaquo; ${resolvedApp}`;
                document.querySelector('.page-intro').style.display = 'none';
            }

            if (!appNames.length) {
                container.innerHTML = '<p class="status-msg">No gallery images available.</p>';
                return;
            }

            const sections = appNames.map(appName => {
                const items = data[appName];
                const meta = appMeta[appName] ?? { colorClass: 'blue', url: '/', icon: '' };
                const cc = meta.colorClass;
                const sectionId = appName.toLowerCase().replace(/[^a-z0-9]+/g, '-');

                const figures = items.map((item, i) => `
                    <figure class="gallery-figure fig-${cc}">
                        <div class="img-wrap">
                            <button class="img-btn" type="button"
                                    data-src="/${esc(item.src)}"
                                    data-alt="${esc(item.alt || item.title)}"
                                    data-caption="${esc(item.title)}"
                                    data-app="${esc(appName)}"
                                    aria-label="View full size: ${esc(item.title)}">
                                <img class="gallery-img"
                                     src="/${esc(item.src)}"
                                     alt="${esc(item.alt || item.title)}"
                                     loading="${filterApp && i === 0 ? 'eager' : 'lazy'}">
                            </button>
                        </div>
                        <figcaption>${esc(item.title)}</figcaption>
                    </figure>`).join('');

                const iconHtml = meta.icon
                    ? `<img class="app-icon" src="${esc(meta.icon)}" alt="" aria-hidden="true" width="40" height="40">`
                    : '';

                return `
                    <section class="app-section" id="${sectionId}" aria-labelledby="heading-${sectionId}">
                        <div class="app-header c-${cc}">
                            ${iconHtml}
                            <h2 class="app-heading c-${cc}" id="heading-${sectionId}">${esc(appName)}</h2>
                            <a class="launch-link c-${cc}" href="${esc(meta.url)}">Launch ${esc(appName)}</a>
                        </div>
                        <div class="gallery-grid">${figures}</div>
                    </section>`;
            });

            container.innerHTML = sections.join('');
        }

        function countGoatEvent(eventText) {
            if (window.goatcounter && typeof window.goatcounter.count === 'function' && eventText) {
                window.goatcounter.count({ path: eventText, title: eventText, event: true });
            }
        }

        function initialiseLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');
            let allImages = [];
            let currentIndex = 0;

            function openLightbox(btn) {
                allImages = Array.from(document.querySelectorAll('.img-btn'));
                currentIndex = allImages.indexOf(btn);
                showImage(currentIndex);
                lightbox.classList.add('is-open');
                document.body.style.overflow = 'hidden';
                document.getElementById('lightbox-close').focus();
                countGoatEvent(`${btn.dataset.app} lightbox opened`);
            }

            function closeLightbox() {
                lightbox.classList.remove('is-open');
                document.body.style.overflow = '';
            }

            function showImage(index) {
                const btn = allImages[index];
                lightboxImg.src = btn.dataset.src;
                lightboxImg.alt = btn.dataset.alt;
                lightboxCaption.textContent = btn.dataset.caption;
                const cc = (appMeta[btn.dataset.app] ?? { colorClass: 'blue' }).colorClass;
                lightboxImg.className = `lightbox-img lb-${cc}`;
            }

            function navigate(dir) {
                currentIndex = (currentIndex + dir + allImages.length) % allImages.length;
                showImage(currentIndex);
            }

            document.getElementById('gallery-content').addEventListener('click', e => {
                const btn = e.target.closest('.img-btn');
                if (btn) openLightbox(btn);
            });

            document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
            document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
            document.getElementById('lightbox-prev').addEventListener('click', () => navigate(-1));
            document.getElementById('lightbox-next').addEventListener('click', () => navigate(1));

            document.addEventListener('keydown', e => {
                if (!lightbox.classList.contains('is-open')) return;
                if (e.key === 'Escape') closeLightbox();
                else if (e.key === 'ArrowLeft') navigate(-1);
                else if (e.key === 'ArrowRight') navigate(1);
            });
        }

        loadGallery();
        initialiseLightbox();
    </script>
</body>

</html>
